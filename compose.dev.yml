# ===========================================================================
# Development Docker Compose file
# ===========================================================================
#
# Purpose:
# --------
#
# This file is a Docker Compose configuration for the development environment. It is only used to run dependencies. You
# should run the application separately using `make dev`.
#
# Setup:
# ------
# make up
# make setup
# To run the application:
# make dev
# ------
x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-finachy_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finachy_password}
  POSTGRES_DB: ${POSTGRES_DB:-finachy_development}
  # Custom port mapping for local development (host:container), to avoid conflicts with local Postgres installations
  DB_PORT: ${DB_PORT:-4321}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-a7523c3d0ae56415046ad8abae168d71074a79534a7062258f8d1d51ac2f76d3c3bc86d86b6b0b307df30d9a6a90a2066a3fa9e67c5e6f374dbd7dd4e0778e13}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: "false"
  RAILS_ASSUME_SSL: "false"
  DB_HOST: db
  DB_PORT: 4321
  REDIS_URL: redis://localhost:6321/1
# NOTE: enabling OpenAI will incur costs when you use AI-related features in the app (chat, rules).  Make sure you have set appropriate spend limits on your account before adding this.
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "4321:5432" # avoid local conflicts
    environment:
      <<: *db_env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finachy_net

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6321:6379" # avoid local conflicts
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finachy_net

volumes:
  postgres-data:
  redis-data:

networks:
  finachy_net:
    driver: bridge
